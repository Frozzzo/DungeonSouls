name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dungeon
          POSTGRES_PASSWORD: dungeon
          POSTGRES_DB: dungeonsouls_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dungeon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dungeon:dungeon@localhost:5432/dungeonsouls_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      # El piloto automático de la prueba E2E que completa un piso solo existe en esta compilación de CI.
      - run: npm run build
        env:
          NEXT_PUBLIC_E2E_AUTOPILOT: "1"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
